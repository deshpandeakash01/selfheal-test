# Self-heal: start the agent automatically when the CI workflow fails.
#
# WHERE IT GOES
#   .github/workflows/self-heal.yml in the repository to be healed, on its
#   DEFAULT branch (main). GitHub only reads workflow_run workflows from there.
#
# WHAT IT NEEDS (README: "Automatic healing")
#   Two secrets in THIS repository (Settings > Secrets and variables > Actions):
#     SELF_HEAL_TOKEN   fine-grained token for this repository:
#                       Contents, Pull requests, Actions = Read and write
#     GOOGLE_API_KEY      the Gemini key            } each key adds that
#     GROQ_API_KEY        a Groq key (free)         } provider's models to the
#     OPENROUTER_API_KEY  an OpenRouter key (free)  } model queue; a missing one
#                                                     is simply skipped
#   The agent itself comes from the public Action deshpandeakash01/self-healing-cicd;
#   nothing else has to be copied or pushed.
#
# IT RUNS LIVE
#   This repository exists to be broken and healed, so the agent writes
#   (live: true). On any other repository, leave `live` out first and read
#   the dry-run diagnoses on the run summaries.
#
# @main: this test repository always uses the newest agent, so a change to
#   the agent is live as soon as it is pushed. Other repositories should
#   use a fixed version, @v1.

name: Self-heal

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: self-heal-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  heal:
    # Saves starting a runner for nothing. The Action checks these again
    # (and more: re-runs, the agent's own branches, forks) whatever this says.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      !startsWith(github.event.workflow_run.head_branch, 'self-heal/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Self-heal
        uses: deshpandeakash01/self-healing-cicd@main
        with:
          github-token: ${{ secrets.SELF_HEAL_TOKEN }}
          google-api-key: ${{ secrets.GOOGLE_API_KEY }}
          groq-api-key: ${{ secrets.GROQ_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          live: true
