# Self-heal: start the agent automatically when the CI workflow fails.
#
# WHERE IT GOES
#   .github/workflows/self-heal.yml in the repository to be healed, on its
#   DEFAULT branch (main). GitHub only reads workflow_run workflows from there.
#
# WHAT IT NEEDS (PROJECT_LOG Appendix B, step 9)
#   - The agent's code in its own repository, made with export_agent_repo.py:
#       deshpandeakash01/self-healing-agent
#   - Two secrets in THIS repository (Settings > Secrets and variables > Actions):
#       SELF_HEAL_TOKEN   fine-grained token with access to BOTH repositories:
#                         this one: Contents, Pull requests, Actions = Read and write
#                         self-healing-agent: Contents = Read-only
#       GOOGLE_API_KEY    the Gemini key
#     A personal token is used instead of GitHub's built-in one because
#     changes pushed with the built-in token do not start CI, so the agent
#     could never check its own fix.
#
# IT RUNS LIVE
#   This repository exists to be broken and healed, so the agent writes
#   (--live). On any other repository, remove --live first and watch dry runs.

name: Self-heal

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: self-heal-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  heal:
    # Only a FIRST failure:
    #   - never the agent's own fix branches: it already watches those itself;
    #   - never a re-run (run_attempt > 1): if the agent re-ran a flaky job and
    #     it failed again, starting the agent again would loop;
    #   - never a run from a fork: a stranger's pull request must not be able
    #     to drive an agent that holds secrets and write access.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1 &&
      !startsWith(github.event.workflow_run.head_branch, 'self-heal/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Get the agent
        uses: actions/checkout@v4
        with:
          repository: deshpandeakash01/self-healing-agent
          token: ${{ secrets.SELF_HEAL_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-agent.txt

      - name: Install the agent's packages
        run: pip install -r requirements-agent.txt

      - name: Run the agent
        env:
          GITHUB_TOKEN: ${{ secrets.SELF_HEAL_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SH_MEMORY_TOP_K: "0"
        run: >-
          python -m agent.run
          --repo "${{ github.repository }}"
          --run-id "${{ github.event.workflow_run.id }}"
          --live
          --retry-overloaded 3

      # The runner is thrown away afterwards: keep the run record.
      - name: Keep the run record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-heal-record-${{ github.event.workflow_run.id }}
          path: data/agent_runs.jsonl
          if-no-files-found: ignore
